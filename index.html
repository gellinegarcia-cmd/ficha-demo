<meta charset="utf-8">
<style>
  :root {
    --fondo: #f3f5f8; --tarjeta: #fff; --texto: #1c2733; --suave: #5b6876; --borde: #d8dee6;
    --primario: #1a56a8; --primario-texto: #fff;
    --prevista: #dfe5ec; --confirmada: #bfe6c9; --cubierta: #d9c8f0; --reemplazo: #a9d4f5;
    --anticipada: #a8e6dc; --vacaciones: #fbe0b5; --espera: #fdeb9c; --conflicto: #f6b3b0;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--fondo); color: var(--texto); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  header { background: var(--primario); color: #fff; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  header b { font-size: 17px; }
  header button { background: none; border: 1px solid #ffffff80; color: #fff; border-radius: 8px; padding: 6px 10px; font-size: 14px; cursor: pointer; }
  main { max-width: 720px; margin: 0 auto; padding: 12px 16px 96px; }
  main.ancho { max-width: 1200px; }
  h2 { font-size: 20px; margin: 8px 0 12px; }
  h3 { font-size: 16px; margin: 16px 0 8px; }
  .tarjeta { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .regla { background: #fff7d6; border: 1px solid #ecd98a; border-radius: 12px; padding: 10px 14px; font-size: 14px; margin-bottom: 12px; }
  .destacado { font-size: 18px; font-weight: 600; }
  .suave { color: var(--suave); font-size: 14px; }
  .error { background: #fde4e3; border: 1px solid #efb0ad; color: #8c1d18; padding: 10px 14px; border-radius: 10px; margin-bottom: 12px; }
  .ok { background: #e1f5e6; border: 1px solid #a8dbb5; color: #17602d; padding: 10px 14px; border-radius: 10px; margin-bottom: 12px; }
  button.grande, a.grande { display: block; width: 100%; min-height: 52px; padding: 12px 14px; margin-bottom: 10px; font-size: 17px; font-weight: 600; border-radius: 12px; border: 1px solid var(--primario); background: var(--primario); color: var(--primario-texto); cursor: pointer; text-align: center; text-decoration: none; }
  button.sec { background: #fff; color: var(--primario); }
  button.peligro { background: #fff; color: #a3211c; border-color: #a3211c; }
  button.chico { min-height: 40px; padding: 6px 12px; font-size: 14px; font-weight: 600; border-radius: 8px; border: 1px solid var(--primario); background: #fff; color: var(--primario); cursor: pointer; margin: 0 6px 6px 0; }
  button:disabled { opacity: .55; cursor: wait; }
  label { display: block; font-weight: 600; margin: 10px 0 4px; font-size: 15px; }
  input, select { width: 100%; min-height: 48px; padding: 8px 10px; font-size: 17px; border: 1px solid #aeb8c4; border-radius: 10px; background: #fff; color: var(--texto); }
  input[type=checkbox] { width: 22px; min-height: 22px; height: 22px; vertical-align: middle; }
  nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid var(--borde); display: flex; overflow-x: auto; z-index: 5; }
  nav button { flex: 1 0 auto; min-width: 68px; min-height: 58px; background: none; border: none; font-size: 13px; color: var(--suave); padding: 6px 8px; cursor: pointer; }
  nav button.activo { color: var(--primario); font-weight: 700; box-shadow: inset 0 3px 0 var(--primario); }
  .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .cal .cab { text-align: center; font-size: 12px; color: var(--suave); padding: 2px 0; }
  .dia { display: flex; flex-direction: column; justify-content: flex-start; min-height: 54px; background: #fff; border: 1px solid var(--borde); border-radius: 8px; padding: 3px; font-size: 13px; text-align: left; color: var(--texto); }
  button.dia { cursor: pointer; }
  .dia.nh .num { color: #b3261e; font-weight: 700; }
  .dia.hoy { outline: 2px solid var(--primario); outline-offset: -1px; }
  .dia.vac { background: var(--vacaciones); }
  .ficha { display: block; border-radius: 5px; padding: 1px 3px; font-size: 12px; font-weight: 600; text-align: center; margin-top: 2px; }
  .c-prevista { background: var(--prevista); } .c-confirmada { background: var(--confirmada); } .c-cubierta { background: var(--cubierta); }
  .c-reemplazo { background: var(--reemplazo); } .c-anticipada { background: var(--anticipada); } .c-espera { background: var(--espera); } .c-conflicto { background: var(--conflicto); } .c-vacaciones { background: var(--vacaciones); }
  .leyenda { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; font-size: 12px; }
  .leyenda span { border-radius: 5px; padding: 2px 6px; }
  .mesnav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 8px; }
  .mesnav button { min-width: 48px; min-height: 44px; background: #fff; border: 1px solid var(--borde); border-radius: 10px; font-size: 18px; cursor: pointer; }
  .mesnav b { font-size: 18px; text-align: center; }
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { border-collapse: collapse; font-size: 13px; background: #fff; }
  th, td { border: 1px solid #c9d1da; padding: 3px 5px; text-align: center; }
  .grilla th:first-child, .grilla td:first-child { position: sticky; left: 0; background: #fff; text-align: left; white-space: nowrap; z-index: 1; }
  .grilla th.nh { color: #b3261e; }
  table.rrhh { font-family: Arial, sans-serif; white-space: nowrap; }
  table.rrhh .t1 { background: #6D9EEB; font-weight: 700; font-size: 15px; text-align: left; }
  table.rrhh .t2 { background: #9FC5E8; font-weight: 700; }
  .fila { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #edf0f4; }
  .fila:last-child { border-bottom: none; }
  .cargando { text-align: center; color: var(--suave); padding: 32px 0; }
  .marca { background: #fff0c2; border-radius: 6px; padding: 1px 6px; font-size: 12px; }
  .opciones { display: flex; gap: 6px; }
  .opciones button { flex: 1 1 0; min-height: 48px; padding: 6px; font-size: 15px; font-weight: 600; border-radius: 10px; border: 1px solid var(--primario); background: #fff; color: var(--primario); cursor: pointer; }
  .opciones button[aria-pressed=true] { background: var(--primario); color: #fff; }
  .opciones button:disabled { opacity: .45; cursor: not-allowed; }
  #fijo { position: fixed; left: 0; right: 0; bottom: 58px; padding: 8px 16px; background: linear-gradient(transparent, var(--fondo) 30%); z-index: 4; }
  #fijo button { display: block; width: 100%; max-width: 688px; margin: 0 auto; min-height: 52px; font-size: 17px; font-weight: 700; border-radius: 12px; border: none; background: #17602d; color: #fff; cursor: pointer; box-shadow: 0 2px 6px #0003; }
  main.confijo { padding-bottom: 170px; }
</style>

  <div style="font-weight:400;font-size:12px;margin-top:2px">Todos los PIN: 1111 · Jefe: JAVIER GARCIA · No usa la planilla real ni manda mensajes</div>
  <div style="margin-top:6px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap">

<script>
(function () {
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  document.getElementById('demo-reiniciar').onclick = async () => {
    (await window.demoServidor()).demoReiniciar();
    try { Object.keys(localStorage).forEach((k) => { if (/guardia/i.test(k)) localStorage.removeItem(k); }); } catch (e) {}
    location.href = location.pathname;
  };
  document.getElementById('demo-cerrar').onclick = () => { document.getElementById('demo-panel').hidden = true; };
  document.getElementById('demo-mensajes').onclick = async () => {
    const m = (await window.demoServidor()).demoMensajes();
    const tg = m.telegram.map((t) => '<div style="background:#eef6ea;border-radius:10px;padding:8px 10px;margin:8px 0"><div style="font-size:12px;color:#555">Telegram a ' + esc(t.a) + '</div>' +
      esc(t.texto).replace(/\n/g, '<br>') + (t.botones.length ? '<div style="margin-top:6px;font-size:12px;color:#335">Botones: ' + t.botones.map((f) => f.map(esc).join(' | ')).join(' / ') + '</div>' : '') + '</div>').join('');
    const ml = m.mails.map((x) => '<div style="background:#f1f3f4;border-radius:10px;padding:8px 10px;margin:8px 0"><div style="font-size:12px;color:#555">Mail a ' + esc(x.a) + '</div><b>' + esc(x.asunto) + '</b><br>' + esc(x.cuerpo).replace(/\n/g, '<br>') + '</div>').join('');
    document.getElementById('demo-lista').innerHTML = (tg + ml) || '<p>Todavía no se generó ningún mensaje.</p>';
    document.getElementById('demo-panel').hidden = false;
  };
})();

<script>
// DEMO: google.script.run llama al simulador que corre en un marco oculto (servidor.html).
(function () {
  const marco = document.createElement('iframe');
  marco.src = 'servidor.html';
  marco.title = 'simulador';
  marco.style.display = 'none';
  const listo = new Promise((res) => marco.addEventListener('load', () => res(marco.contentWindow)));
  document.documentElement.appendChild(marco);
  window.demoServidor = () => listo;
  window.google = { script: { get run() {
    const crear = (ok, mal) => new Proxy({}, { get(_, k) {
      if (k === 'withSuccessHandler') return (f) => crear(f, mal);
      if (k === 'withFailureHandler') return (f) => crear(ok, f);
      return (...args) => listo
        .then((s) => new Promise((r) => setTimeout(r, 80)).then(() => s.demoLlamar(k, args)))
        .then((d) => ok && ok(d))
        .catch((e) => mal && mal({ message: e && e.message ? e.message : String(e) }));
    } });
    return crear();
  } } };
})();
</script><script>
const INICIO = (function () {
  const p = new URLSearchParams(location.search);
  return { v: /^[a-z]{1,20}$/.test(p.get('v') || '') ? p.get('v') : '', g: /^\d{1,9}$/.test(p.get('g') || '') ? p.get('g') : '' };
})();
const CLAVE = 'guardias_upa_sesion';
const DIAS_CAB = ['L', 'M', 'M', 'J', 'V', 'S', 'D'];
const TIPOS = { CONTRATO: 'Contrato', REEMPLAZO_HOSPITAL: 'Paga el hospital', COBERTURA_COMPANERO: 'Paga el compañero' };
const ESTADOS = { PREVISTA: 'Prevista', CONFIRMADA: 'Confirmada', CONFIRMADA_ANTICIPADA: 'Confirmada por adelantado', ESPERANDO_CONFIRMACION_TITULAR: 'Esperando confirmación', EN_CONFLICTO: 'En conflicto', ANULADA: 'Anulada' };
const NAV_MEDICO = [['mes', 'Mi mes'], ['vacaciones', 'Vacaciones'], ['deudas', 'Deudas'], ['contrato', 'Guardia fija']];
const NAV_JEFE = [['tablero', 'Tablero'], ['conflictos', 'Conflictos'], ['excel', 'Excel'], ['medicos', 'Médicos'], ['ajustes', 'Ajustes']];
const VISTAS_JEFE = NAV_JEFE.map(n => n[0]);

let token = leer();
let datos = null;
let vista = 'mes';
let modoJefe = false;
let mesActual = null;
let aviso = null;
const $ = (id) => document.getElementById(id);

function leer() { try { return localStorage.getItem(CLAVE) || ''; } catch (e) { return ''; } }
function escribir(v) { try { v ? localStorage.setItem(CLAVE, v) : localStorage.removeItem(CLAVE); } catch (e) {} }

// Crea nodos uno por uno: los nombres y textos de la planilla nunca se interpretan como HTML.
function el(tag, props, ...hijos) {
  const n = document.createElement(tag);
  Object.entries(props || {}).forEach(([k, v]) => {
    if (v === undefined || v === null || v === false) return;
    if (k === 'class') n.className = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (k in n && k !== 'list') n[k] = v;
    else n.setAttribute(k, v);
  });
  hijos.flat().forEach((h) => { if (h !== null && h !== undefined && h !== false) n.append(h.nodeType ? h : String(h)); });
  return n;
}

function llamar(metodo, ...args) {
  return new Promise((ok, mal) => {
    google.script.run
      .withSuccessHandler((r) => {
        if (r && r.ok) return ok(r.datos);
        if (r && r.sesion) { salir(); return mal(new Error(r.error)); }
        mal(new Error((r && r.error) || 'Hubo un error.'));
      })
      .withFailureHandler(() => mal(new Error('No hay conexión. Probá de nuevo.')))
      .api(token, metodo, args);
  });
}

function pintar(...nodos) {
  const app = $('app');
  app.className = modoJefe && (vista === 'tablero' || vista === 'excel') ? 'ancho' : (!modoJefe && vista === 'mes' ? 'confijo' : '');
  app.replaceChildren(...nodos.flat().filter(Boolean));
  window.scrollTo(0, 0);
}
function cargando() { pintar(el('div', { class: 'cargando' }, 'Cargando…')); }
function mostrarError(e) { pintar(el('div', { class: 'error' }, e.message), el('button', { class: 'grande sec', onclick: () => ir(vista) }, 'Reintentar')); }
function bloqueAviso() {
  if (!aviso) return null;
  const a = aviso;
  aviso = null;
  return el('div', { class: a.error ? 'error' : 'ok', role: 'status' }, a.texto,
    a.deshacer ? el('div', { style: 'margin-top:8px' }, botonDeshacer(a.deshacer)) : null);
}
function botonDeshacer(id) {
  return el('button', { class: 'chico', onclick: accion(async () => { await llamar('deshacer', id); aviso = { texto: 'Deshecho.' }; ir('mes'); }) }, 'Deshacer');
}
// Botón que se desactiva mientras espera: evita confirmar dos veces por tocar dos veces.
function accion(fn) {
  return async (ev) => {
    const b = ev.currentTarget;
    b.disabled = true;
    try { await fn(); } catch (e) { aviso = { texto: e.message, error: true }; b.disabled = false; ir(vista); }
  };
}
function fechaLinda(f) { const p = f.split('-'); return Number(p[2]) + '/' + p[1] + '/' + p[0]; }
function categoriaLocal(f) {
  const d = new Date(f + 'T12:00:00').getDay();
  return d === 0 || d === 6 || datos.feriados.includes(f) ? 'no hábil' : 'hábil';
}
function sumarMes(m, n) { const d = new Date(Date.UTC(+m.slice(0, 4), +m.slice(5) - 1 + n, 1)); return d.toISOString().slice(0, 7); }
function navMes(titulo, cambiar) {
  return el('div', { class: 'mesnav' },
    el('button', { 'aria-label': 'Mes anterior', onclick: () => { mesActual = sumarMes(mesActual, -1); cambiar(); } }, '‹'),
    el('b', null, titulo),
    el('button', { 'aria-label': 'Mes siguiente', onclick: () => { mesActual = sumarMes(mesActual, 1); cambiar(); } }, '›'));
}

// --- Ingreso ---
async function pantallaLogin() {
  $('cab').hidden = true;
  $('nav').hidden = true;
  $('fijo').hidden = true;
  cargando();
  google.script.run.withSuccessHandler((lista) => {
    const sel = el('select', { id: 'quien' }, el('option', { value: '' }, 'Elegí tu nombre…'), lista.map((m) => el('option', { value: m.id }, m.nombre)));
    const pin = el('input', { id: 'pin', type: 'password', inputMode: 'numeric', maxLength: 4, autocomplete: 'current-password', pattern: '[0-9]*' });
    const error = el('div', { class: 'error', hidden: true, role: 'alert' });
    const boton = el('button', { class: 'grande', type: 'submit' }, 'Entrar');
    const form = el('form', { onsubmit: (ev) => {
      ev.preventDefault();
      error.hidden = true;
      if (!sel.value || pin.value.length !== 4) { error.textContent = 'Elegí tu nombre y escribí tu PIN de 4 números.'; error.hidden = false; return; }
      boton.disabled = true;
      google.script.run.withSuccessHandler((r) => {
        if (r.ok) { token = r.token; escribir(token); arrancar(); return; }
        error.textContent = r.error; error.hidden = false; boton.disabled = false; pin.value = '';
      }).withFailureHandler(() => { error.textContent = 'No hay conexión. Probá de nuevo.'; error.hidden = false; boton.disabled = false; }).login(sel.value, pin.value);
    } }, el('label', { htmlFor: 'quien' }, 'Nombre'), sel, el('label', { htmlFor: 'pin' }, 'PIN'), pin, el('br'), boton);
    pintar(el('h2', null, 'Guardias UTI UPA 5'), error, el('div', { class: 'tarjeta' }, form), el('div', { class: 'regla' }, 'Cargar es la forma de cobrar: lo que no esté confirmado al cierre del mes se reclama en el cierre siguiente.'));
  }).withFailureHandler(() => mostrarError(new Error('No hay conexión. Probá de nuevo.'))).medicosPublico();
}

function salir() { token = ''; escribir(''); datos = null; modoJefe = false; pantallaLogin(); }

async function arrancar() {
  if (!token) return pantallaLogin();
  cargando();
  try { datos = await llamar('inicio'); } catch (e) { if (token) mostrarError(e); return; }
  mesActual = datos.hoy.slice(0, 7);
  $('cab').hidden = false;
  $('cab-nombre').textContent = datos.yo.nombre;
  $('btn-jefe').hidden = !datos.yo.admin;
  if (datos.revisar_contrato) return pantallaRevisarContrato();
  seguirAlInicio();
}

function seguirAlInicio() {
  let inicial = INICIO.v || 'mes';
  if (VISTAS_JEFE.includes(inicial)) modoJefe = !!datos.yo.admin;
  INICIO.v = '';
  if (inicial === 'confirmar' && INICIO.g) return irConfirmar(INICIO.g);
  ir(inicial === 'confirmar' ? 'mes' : inicial);
}

// Primer ingreso: revisa la guardia fija que se le cargó.
function pantallaRevisarContrato() {
  const capital = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  const lineas = datos.fijas.map((f) => el('div', { class: 'destacado', style: 'margin-bottom:6px' }, capital(f.dia_semana) + ' · ' + f.turno,
    el('div', { class: 'suave', style: 'font-weight:400' }, f.tipo === 'REEMPLAZO_HOSPITAL' ? 'Reemplazo fijo (paga el hospital)' : 'Contrato')));
  pintar(el('h2', null, '¿Es correcta tu guardia de contrato?'),
    el('div', { class: 'tarjeta' }, lineas.length ? lineas : el('span', { class: 'suave' }, 'Todavía no tenés una guardia cargada.')),
    el('button', { class: 'grande', onclick: accion(async () => { await llamar('confirmarContrato'); datos.revisar_contrato = false; seguirAlInicio(); }) }, 'Sí'),
    el('button', { class: 'grande sec', onclick: () => { datos.revisar_contrato = false; ir('contrato'); } }, 'Corregir'));
}

function ir(v) {
  vista = v;
  pintarNav();
  const pantallas = { mes: verMes, cargar: () => verCargar(datos.hoy), vacaciones: verVacaciones, deudas: verDeudas, contrato: verContrato,
    tablero: verTablero, conflictos: verConflictos, excel: verExcel, medicos: verMedicos, ajustes: verAjustes };
  (pantallas[v] || verMes)();
}
function pintarNav() {
  const nav = $('nav');
  nav.hidden = false;
  $('fijo').hidden = modoJefe || vista !== 'mes';
  $('btn-jefe').textContent = modoJefe ? 'Vista médico' : 'Vista jefe';
  nav.replaceChildren(...(modoJefe ? NAV_JEFE : NAV_MEDICO).map(([k, t]) => el('button', { class: vista === k ? 'activo' : '', onclick: () => ir(k) }, t)));
}
$('btn-salir').addEventListener('click', salir);
$('btn-cargar').addEventListener('click', () => verCargar(datos.hoy));
$('btn-jefe').addEventListener('click', () => { modoJefe = !modoJefe; ir(modoJefe ? 'tablero' : 'mes'); });

// --- Médico: Mi mes ---
const NOMBRE_COLOR = { prevista: 'Prevista', confirmada: 'Confirmada', cubierta: 'Cubierta', reemplazo: 'Reemplazo', espera: 'Esperando', conflicto: 'Conflicto' };
async function verMes() {
  cargando();
  let d;
  try { d = await llamar('miMes', mesActual); } catch (e) { return mostrarError(e); }
  const primero = (new Date(d.dias[0].fecha + 'T12:00:00').getDay() + 6) % 7;
  const celdas = DIAS_CAB.map((c) => el('div', { class: 'cab' }, c));
  for (let i = 0; i < primero; i++) celdas.push(el('div'));
  d.dias.forEach((dia) => {
    const clase = 'dia' + (dia.no_habil ? ' nh' : '') + (dia.fecha === datos.hoy ? ' hoy' : '') + (dia.vacaciones ? ' vac' : '');
    const fichas = dia.guardias.map((g) => el('span', { class: 'ficha c-' + g.color }, g.texto));
    // Cualquier día se puede tocar: con guardia abre esa guardia, y vacío abre la carga.

function descargar(r) {
  const bin = atob(r.base64);
  const bytes = Uint8Array.from(bin, (c) => c.charCodeAt(0));
  const url = URL.createObjectURL(new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
  const a = el('a', { href: url, download: r.nombre });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
